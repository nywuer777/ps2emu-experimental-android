[package]
name = "ps2emu-experimental"
version = "0.90.0"
edition = "2021"
rust-version = "1.75"
license = "GPL-3.0-or-later"

[lib]
name = "ps2emu_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "ps2emu-probe"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

